name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  MCP_SERVER_NAME: io.github.runscope/mcp-bzm-apitest
  MCP_SCHEMA: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json

jobs:
  publish:
    if: github.repository == 'Runscope/mcp-bzm-apitest'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify registry metadata versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(
            python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              print(tomllib.load(project_file)["project"]["version"])
          PY
          )"

          if ! jq -e '.packages | length == 1' server.json >/dev/null; then
            echo "::error::server.json must define exactly one package."
            exit 1
          fi

          server_schema="$(jq -er '."$schema"' server.json)"
          server_name="$(jq -er '.name' server.json)"
          server_version="$(jq -er '.version' server.json)"
          package_type="$(jq -er '.packages[0].registryType' server.json)"
          package_version="$(jq -er '.packages[0].version' server.json)"
          package_identifier="$(jq -er '.packages[0].identifier' server.json)"
          package_transport="$(jq -er '.packages[0].transport.type' server.json)"
          expected_identifier="ghcr.io/runscope/mcp-bzm-apitest:${project_version}"

          mismatches=()
          [[ "$server_schema" == "$MCP_SCHEMA" ]] ||
            mismatches+=("server schema: $server_schema (expected $MCP_SCHEMA)")
          [[ "$server_name" == "$MCP_SERVER_NAME" ]] ||
            mismatches+=("server name: $server_name (expected $MCP_SERVER_NAME)")
          [[ "$server_version" == "$project_version" ]] ||
            mismatches+=("server version: $server_version (expected $project_version)")
          [[ "$package_type" == "oci" ]] ||
            mismatches+=("package registry type: $package_type (expected oci)")
          [[ "$package_version" == "$project_version" ]] ||
            mismatches+=("package version: $package_version (expected $project_version)")
          [[ "$package_identifier" == "$expected_identifier" ]] ||
            mismatches+=("package identifier: $package_identifier (expected $expected_identifier)")
          [[ "$package_transport" == "stdio" ]] ||
            mismatches+=("package transport: $package_transport (expected stdio)")

          if (( ${#mismatches[@]} )); then
            echo "::error::Registry metadata is out of sync with pyproject.toml:"
            printf '  %s\n' "${mismatches[@]}" >&2
            exit 1
          fi

          echo "image=$expected_identifier" >> "$GITHUB_OUTPUT"

      - name: Verify OCI ownership label
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          prerequisite_error() {
            echo "::error::ghcr.io/runscope/mcp-bzm-apitest:1.3.1 must be rebuilt and republished from the updated Dockerfile with the exact io.modelcontextprotocol.server.name=$MCP_SERVER_NAME label before registry publication."
          }

          if ! image_metadata="$(
            docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>image-inspect-error.log
          )"; then
            prerequisite_error
            cat image-inspect-error.log >&2
            exit 1
          fi

          if ! jq -e --arg name "$MCP_SERVER_NAME" '
            type == "object"
            and length > 0
            and all(
              to_entries[];
              .value.config.Labels["io.modelcontextprotocol.server.name"] == $name
            )
          ' <<< "$image_metadata" >/dev/null; then
            prerequisite_error
            jq -r '
              to_entries[]
              | "\(.key): \(.value.config.Labels["io.modelcontextprotocol.server.name"] // "<missing>")"
            ' <<< "$image_metadata" >&2
            exit 1
          fi

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish
